<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Public Library-Home</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        * {
            padding: 0;
            margin: 0;
        }

        body {
            background-color: #cad2c5;
        }

        .navbar {
            height: 9vh;
            background-color: #22223b;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 15px;
            position: relative;
            flex-wrap: nowrap;
        }

        .logo-bar {
            color: white;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            gap: 15px;
            height: 9vh;
            flex: 1;
            min-width: 0;
        }

        .logo {
            font-size: 3vh;
            padding: 8px;
            flex-shrink: 0;
        }

        .logo-compo {
            display: flex;
            align-items: center;
            gap: 8px;
            flex-shrink: 0;
        }

        .logo-compo p {
            margin: 0;
            font-size: 1.2rem;
            font-weight: bold;
            line-height: 1.2;
            white-space: nowrap;
        }

        .register {
            color: white;
            display: flex;
            justify-content: flex-end;
            align-items: center;
            gap: 10px;
            padding: 0;
            flex-shrink: 0;
        }

        .login-logo {
            font-size: 20px;
            padding: 5px;
        }

        .btn {
            background-color: #b0c4b1;
            color: rgb(4, 4, 62);
            border-radius: 5px;
            padding: 8px 12px;
            margin: 0;
            font-size: 0.9rem;
            font-weight: 500;
            border: none;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .btn:hover {
            background-color: #f0f0f0;
            color: black;
            transform: translateY(-1px);
        }

        .btn.btn-dark {
            background-color: rgba(255, 255, 255, 0.1);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.3);
        }

        .btn.btn-dark:hover {
            background-color: rgba(255, 255, 255, 0.2);
        }

        .container {
            padding: 5vw;
            background-color: #cad2c5;
            margin: 0;
            width: 100vw;
            height: 110vh;
        }

        .image-back {
            background-image: url("Images/library1.jpg");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            height: 100vh;
            width: 90vw;
            display: flex;
            justify-content: flex-start;
            align-items: center;
            flex-direction: column;
            border-radius: 15px;
            padding: 3%;
        }

        .search-bar {
            align-self: flex-end;
            display: flex;
            justify-content: center;
            align-items: center;

        }

        .search-in {
            padding: 6.5px;
            border-radius: 10px 0 0 10px;
            font-size: 12px;
            width: 15vw;
        }

        .search-btn {
            border-radius: 0 10px 10px 0;
            font-size: 15px;
            padding: 5.5px;
            background-color: #b0c4b1;
            color: rgb(4, 4, 62);
            border: 0.5px solid #22223b;
        }

        .search-btn:hover {
            border: 0.5px solid black;
            background-color: #a2caa4;
            color: black;
        }

        @media (max-width: 1030px) {
            .navbar {
                height: 8vh;
                padding: 0 10px;
            }

            .logo-bar {
                height: 8vh;
                gap: 10px;
            }

            .logo {
                font-size: 2.5vh;
                padding: 6px;
            }

            .logo-compo p {
                font-size: 1rem;
            }

            .register {
                gap: 8px;
            }

            .btn {
                padding: 6px 10px;
                font-size: 0.8rem;
            }

            .login-logo {
                font-size: 18px;
                padding: 4px;
            }
        }

        @media (max-width: 768px) {
            .navbar {
                height: 7vh;
                padding: 0 8px;
            }

            .logo-bar {
                height: 7vh;
                gap: 8px;
            }

            .logo {
                font-size: 2vh;
                padding: 4px;
            }

            .logo-compo p {
                font-size: 0.9rem;
            }

            .register {
                gap: 6px;
            }

            .btn {
                padding: 5px 8px;
                font-size: 0.75rem;
            }

            .login-logo {
                font-size: 16px;
                padding: 3px;
            }
        }

        @media (max-width: 500px) {
            .navbar {
                height: 6.5vh;
                padding: 0 5px;
            }

            .logo-bar {
                height: 6.5vh;
                gap: 5px;
            }

            .logo {
                font-size: 1.8vh;
                padding: 3px;
            }

            .logo-compo p {
                font-size: 0.8rem;
                line-height: 1.1;
            }

            .register {
                gap: 4px;
            }

            .btn {
                padding: 4px 6px;
                font-size: 0.7rem;
            }

            .login-logo {
                font-size: 14px;
                padding: 2px;
            }

            .image-back {
                height: 85vh;
            }

            .search-bar {
                padding: 6px;
            }

            .search-in {
                padding: 3.25px;
                font-size: 8px;
            }

            .search-btn {
                padding: 2.25px;
                font-size: 10px;
            }

            .info-bar {
                padding: 7px;
            }

            .info-compo {
                gap: 2.5vh;
                padding: 3px;
            }
        }

        @media (max-width: 391px) {
            .navbar {
                height: 6vh;
                padding: 0 3px;
            }

            .logo-bar {
                height: 6vh;
                gap: 3px;
            }

            .logo {
                font-size: 1.5vh;
                padding: 2px;
            }

            .logo-compo p {
                font-size: 0.7rem;
                line-height: 1;
            }

            .register {
                gap: 3px;
            }

            .btn {
                padding: 3px 5px;
                font-size: 0.65rem;
            }

            .login-logo {
                font-size: 12px;
                padding: 1px;
            }

            .image-back {
                height: 70vh;
            }

            .info-bar {
                padding: 5px;
            }

            .info-compo {
                gap: 1vh;
                padding: 2px;
            }
        }

        .sidebar {
            padding: none;
        }

        @media (max-width: 320px) {
            .navbar {
                height: 5.5vh;
                padding: 0 2px;
            }

            .logo-bar {
                height: 5.5vh;
                gap: 2px;
            }

            .logo {
                font-size: 1.3vh;
                padding: 1px;
            }

            .logo-compo p {
                font-size: 0.6rem;
                line-height: 0.9;
            }

            .register {
                gap: 2px;
            }

            .btn {
                padding: 2px 4px;
                font-size: 0.6rem;
            }

            .login-logo {
                font-size: 10px;
                padding: 1px;
            }
        }

        .logo-compo p {
            word-break: break-word;
            overflow-wrap: break-word;
        }

        .book-list {
            margin-top: 3vw;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            width: 100%;
        }

        /* Book card */
        .book {
            background: #f2f2f2;
            padding: 1rem;
            border-radius: 10px;
            opacity: 0.85;
            text-align: center;
            transition: transform 0.2s;
        }

        .book:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
        }

        .book img {
            height: 150px;
            width: auto;
            margin-bottom: 10px;
            border-radius: 5px;
            object-fit: cover;
        }

 
    </style>
</head>

<body>
    <div class="navbar">
        <div class="logo-bar">
            <div class="logo-compo">
                <i class="fa-solid fa-book logo"></i>
                <p>Public<br>Library</p>
            </div>

            <button class="btn btn-dark m-3" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebar">
                <i class="fa fa-bars"></i> Menu
            </button>

            
            <div class="offcanvas offcanvas-start" tabindex="-1" id="sidebar">
                <div class="offcanvas-header">
                    <h5 class="offcanvas-title">Menu</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="offcanvas"></button>
                </div>
                <div class="offcanvas-body">
                    <ul class="list-unstyled">
                        <li><a href="index.html" class="nav-link">Home</a></li>
                        <li><a href="#" class="nav-link">About</a></li>
                        <li><a href="#" class="nav-link">Contact Us</a></li>
                    </ul>
                </div>
            </div>

        </div>
        <div class="register">
            <div class="search-bar">
                <input type="text" name="book-name" placeholder="Enter book name " class="search-com search-in" />
                <button class="search-btn search-com">Search</button>
            </div>
            <i class="fa-solid fa-right-to-bracket login-logo"></i>
            <button class="login btn">Log in</button>
            <button class="sign-up btn">Sign up</button>
        </div>
    </div>

    <div class="container">
        <div class="image-back">
            <i class="fa-solid fa-book-open-reader" style="font-size: 10vw; color : white"></i>
            <h1 style="font-size: 5vh; color : white; text-align: center;">Hello user, <br> Welcome back</h1>
            <div class="book-list" id="bookList"></div>
        </div>

    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/js/all.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        btn1 = document.querySelector(".login");
        btn1.addEventListener("click", () => {
            window.location.href = "login.html";
        })
        btn2 = document.querySelector(".sign-up");
        btn2.addEventListener("click", () => {
            window.location.href = "signup.html";
        })

        const books = [
            { name: "The Spanish Love Deception", author: "Elena Armas", link: "Images/spanish-love-deception.jpg" },
            { name: "Pride and Prejudice", author: "Jane Austen", link: "Images/pride-and-pre.jpg" },
            { name: "Days at the Morisaki Bookshop", author: "Satoshi Yagisawa", link: "Images/days-at-mora.jpg" },
            { name: "The Metamorphosis", author: "Franz Kafka", link: "Images/the-metamor.jpg" },
            { name: "Kings of Wrath", author: "Eva Ashwood", link: "Images/kings-of-wrath.jpg" },
            { name: "Do epic shit", author: "Ankur Warikoo",link: "Images/do-epic-shit.png"},
            { name: "1984", author: "Gorgre Orwell", link: "Images/1984.jpeg"},
            { name: "Animal Farm", author: "Gorgre Orwell", link: "Images/animal-farm.webp"},
            { name: "The Alchemist", author: "Paulo Coelho", link: "Images/the-alchemist.jpg"},
            { name: "Better than the movies", author: "Lynn Painter", link: "Images/better-than-the-movie.jpeg"},
            { name: "Archer's voice", author: "Mia Sheridan", link: "Images/archer's-voice.jpeg"},
        ];

        const searchBox = document.querySelector(".search-in");
        const bookList = document.querySelector("#bookList");

        // Function to display books
        function displayBooks(filteredBooks) {
            bookList.innerHTML = "";
            if (filteredBooks.length === 0) {
                const div1 = document.createElement("div");
                div1.classList.add("not-found");
                bookList.innerHTML = "<p>No results found</p>";
                return;
            }
            filteredBooks.forEach(book => {
                const div = document.createElement("div");
                div.classList.add("book");
                div.innerHTML = `<strong>${book.name}</strong><br><img src=${book.link} alt=${book.name}><br><em>${book.author}</em>`
                bookList.appendChild(div);
            });
        }

        // Initially show all books
        displayBooks(books);

        // Search function
        searchBox.addEventListener("input", function () {
            const query = searchBox.value.toLowerCase();
            const filtered = books.filter(book =>
                book.name.toLowerCase().includes(query) ||
                book.author.toLowerCase().includes(query)
            );
            displayBooks(filtered);
        });
    </script>
</body>

</html>
